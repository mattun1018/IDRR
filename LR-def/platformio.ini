; ESP32-C3 SuperMini用のPlatformIO設定
[env:esp32c3]
platform = espressif32

; ESP32-C3 SuperMiniに対応するボードIDを指定します
; 一般的な選択肢: lolin_c3_mini, seeed_xiao_esp32c3, esp32-c3-devkitm-1
; お使いのボードに合わせて調整してください
board = lolin_c3_mini

framework = arduino
monitor_speed = 115200

lib_deps =
  ROBOTIS-GIT/Dynamixel2Arduino
