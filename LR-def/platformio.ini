; ==== ESP32-C3 SuperMini / LOLIN C3 Mini 互換（安定）====
[env:esp32c3-stable]
platform = espressif32 @ 6.12.0
board = lolin_c3_mini
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; ネイティブUSBをシリアルとして起動（C3はこれが便利）
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

; あると便利なモニタ設定（改行・タイムスタンプ等）
monitor_filters = time, colorize, direct

; ライブラリ（DYNAMIXEL制御を使うなら）
lib_deps =
  ROBOTIS-GIT/Dynamixel2Arduino